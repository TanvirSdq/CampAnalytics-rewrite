<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- CampTools Modern Icon (Transparent Canvas · Geometric Sharp Lines) -->
  
  <!-- Shutter Button Accent (Wikimedia Red) -->
  <rect x="96" y="94" width="64" height="26" fill="#dd3333"/>
  
  <!-- Pentaprism Top -->
  <polygon points="212,120 236,88 276,88 300,120" fill="#202122" stroke="#ffffff" stroke-width="6" stroke-linejoin="miter"/>
  
  <!-- Camera Body Chassis with subtle white contrast keyline for dark tab contrast -->
  <rect x="48" y="120" width="416" height="296" fill="#202122" stroke="#ffffff" stroke-width="6"/>
  
  <!-- Pentaprism Inner Fill (covering seam) -->
  <polygon points="214,121 236,91 276,91 298,121" fill="#202122"/>
  
  <!-- Central Aperture Lens Outer Ring -->
  <circle cx="256" cy="268" r="118" fill="#ffffff" stroke="#c8ccd1" stroke-width="4"/>
  <circle cx="256" cy="268" r="104" fill="#f8f9fa"/>
  
  <!-- Calibration Baseline -->
  <line x1="164" y1="336" x2="348" y2="336" stroke="#d5d9de" stroke-width="4"/>
  
  <!-- Ascending Analytics Columns (Influx, Retention, Quality) -->
  <rect x="184" y="264" width="36" height="72" fill="#dd3333"/>
  <rect x="238" y="214" width="36" height="122" fill="#3366cc"/>
  <rect x="292" y="164" width="36" height="172" fill="#00af89"/>
  
  <!-- Dynamic Longitudinal Trendline & Arrow (Wikimedia Amber #ee9900) -->
  <polyline points="166,298 202,264 256,214 310,164 346,128" fill="none" stroke="#ee9900" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>
  <polygon points="346,112 366,144 334,144" fill="#ee9900" transform="rotate(45 346 128)"/>
</svg>