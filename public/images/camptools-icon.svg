<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- CampTools Official Icon -->
  <!-- Top Hardware Accent: Red Shutter Button & Dial -->
  <rect x="84" y="92" width="64" height="28" fill="#dd3333"/>
  <rect x="364" y="100" width="56" height="20" fill="#72777d"/>
  <polygon points="216,120 236,90 276,90 296,120" fill="#202122"/>
  
  <!-- Camera Body Chassis (Sharp 90-degree Codex Geometry) -->
  <rect x="48" y="120" width="416" height="300" fill="#202122"/>
  
  <!-- Grip Stripe Accent (Codex Blue) -->
  <rect x="68" y="144" width="14" height="252" fill="#3366cc"/>
  
  <!-- Viewfinder Optical Sensor (Top Right) -->
  <rect x="376" y="144" width="52" height="36" fill="#3366cc" stroke="#54595d" stroke-width="4"/>
  
  <!-- Central Aperture Lens Outer Ring -->
  <circle cx="256" cy="270" r="120" fill="#ffffff" stroke="#c8ccd1" stroke-width="6"/>
  <circle cx="256" cy="270" r="106" fill="#f8f9fa"/>
  
  <!-- Lens Calibration Axis -->
  <line x1="160" y1="336" x2="352" y2="336" stroke="#c8ccd1" stroke-width="4"/>
  
  <!-- Ascending Analytics Columns (Influx, Retention, Quality) -->
  <!-- 1. Participant Influx (Wikimedia Red #dd3333) -->
  <rect x="180" y="266" width="38" height="70" fill="#dd3333"/>
  
  <!-- 2. Contributor Retention (Wikimedia Blue #3366cc) -->
  <rect x="234" y="216" width="38" height="120" fill="#3366cc"/>
  
  <!-- 3. Quality & Utility Recognition (Wikimedia Green #00af89) -->
  <rect x="288" y="166" width="38" height="170" fill="#00af89"/>
  
  <!-- Dynamic Longitudinal Trendline (Wikimedia Amber #ee9900) -->
  <polyline points="160,306 199,266 253,216 307,166 348,125" fill="none" stroke="#ee9900" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Pointer Arrow -->
  <polygon points="348,110 366,140 336,140" fill="#ee9900" transform="rotate(45 348 125)"/>
</svg>